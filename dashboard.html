<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | fatCoinCapital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://widgets.coingecko.com/gecko-coin-ticker-widget.js"></script>
    <script src="https://widgets.coingecko.com/gecko-coin-converter-widget.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .stats-card { border-radius: 2.5rem; transition: all 0.3s ease; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        .sidebar-closed { transform: translateX(100%); }
        .sidebar-open { transform: translateX(0); }
        .modal { display: none; position: fixed; inset: 0; z-index: 200; align-items: center; justify-content: center; padding: 1.5rem; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 2.5rem; padding: 2.5rem; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .market-terminal { min-width: 320px; flex-shrink: 0; snap-align: center; }
        .asset-card-compact { min-width: 260px; background: rgba(10, 11, 13, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2rem; padding: 1.5rem; flex-shrink: 0; snap-align: center; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden">

    <div id="global-overlay" onclick="closeAllModals()" class="fixed inset-0 bg-black/60 opacity-0 pointer-events-none z-[150] transition-opacity backdrop-blur-sm"></div>
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 opacity-0 pointer-events-none z-[60]"></div>

    <div id="depositModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-start mb-2">
                <h2 class="text-2xl font-black uppercase">Deposit <span id="depAsset" class="text-blue-600">---</span></h2>
                <button onclick="closeAllModals()" class="text-gray-400 hover:text-black transition">✕</button>
            </div>
            <p class="text-gray-400 text-[10px] font-bold uppercase mb-6">Enter amount to view wallet address</p>
            <input type="number" id="depAmount" placeholder="Amount ($)" class="w-full bg-gray-50 border border-gray-100 p-4 rounded-2xl mb-4 focus:outline-none focus:border-blue-500 font-bold text-lg">
            <div class="bg-blue-50 p-4 rounded-2xl mb-6 border border-blue-100">
                <p class="text-[9px] font-black text-blue-600 uppercase mb-1">Company Receiving Address:</p>
                <p id="modalAddr" class="text-[10px] font-mono break-all text-gray-700 leading-relaxed">---</p>
            </div>
            <button onclick="completeDeposit()" class="w-full py-4 bg-[#2b59ff] text-white rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition">Copy Address & Done</button>
        </div>
    </div>

    <div id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl sidebar-closed z-[70] flex flex-col p-8">
        <div class="flex justify-between items-center mb-10">
            <span class="font-black uppercase tracking-widest text-[10px] text-gray-400">Navigation Menu</span>
            <button onclick="toggleSidebar()" class="text-xl">✕</button>
        </div>
        <nav class="flex flex-col gap-3">
            <button onclick="toggleSidebar()" class="bg-[#2b59ff] text-white p-5 rounded-3xl text-xs font-black uppercase text-left tracking-widest">Home</button>
            <button onclick="toggleSidebar()" class="bg-gray-100 text-gray-900 p-5 rounded-3xl text-xs font-black uppercase text-left tracking-widest">Dashboard</button>
            <button onclick="toggleSidebar()" class="bg-gray-100 text-gray-900 p-5 rounded-3xl text-xs font-black uppercase text-left tracking-widest">Market News</button>
            <button onclick="toggleSidebar()" class="bg-gray-100 text-gray-900 p-5 rounded-3xl text-xs font-black uppercase text-left tracking-widest">Security Settings</button>
            <button onclick="logout()" class="text-left text-red-500 font-black text-xs uppercase p-5 tracking-widest">Logout</button>
        </nav>
    </div>

    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#2b59ff] rounded-full flex items-center justify-center text-white font-bold">f</div>
                <span class="text-xl font-bold uppercase tracking-tight">fatCoinCapital</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="w-10 h-10 bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-center">☰</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 pb-32">
        <div class="mb-12">
            <div class="flex justify-between items-center mb-6 px-2">
                <h3 class="text-xs font-black uppercase tracking-[0.2em] text-gray-400">Live Market Intelligence</h3>
                <span class="text-[9px] font-bold text-blue-500 uppercase animate-pulse">Swipe to explore →</span>
            </div>
            <div class="flex overflow-x-auto snap-x no-scrollbar gap-6 pb-4">
                <div class="market-terminal bg-[#0a0b0d] p-8 rounded-[2.5rem] border border-gray-800 shadow-2xl">
                    <gecko-coin-ticker-widget coin-id="bitcoin" initial-currency="usd" locale="en" dark-mode="true" transparent-background="true"></gecko-coin-ticker-widget>
                    <div class="grid grid-cols-2 gap-3 mt-8">
                        <button onclick="openDeposit('BTC', 'bc1qyc...rq9x8')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-green-500/20 transition">
                            <span class="text-xl mb-1">⬇️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Deposit</span>
                        </button>
                        <button onclick="alert('Withdrawal Locked')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-red-500/20 transition">
                            <span class="text-xl mb-1">⬆️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Withdraw</span>
                        </button>
                    </div>
                </div>
                <div class="market-terminal bg-[#0a0b0d] p-8 rounded-[2.5rem] border border-gray-800 shadow-2xl">
                    <gecko-coin-ticker-widget coin-id="ethereum" initial-currency="usd" locale="en" dark-mode="true" transparent-background="true"></gecko-coin-ticker-widget>
                    <div class="grid grid-cols-2 gap-3 mt-8">
                        <button onclick="openDeposit('ETH', '0xb43F...6402')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-green-500/20 transition">
                            <span class="text-xl mb-1">⬇️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Deposit</span>
                        </button>
                        <button onclick="alert('Withdrawal Locked')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-red-500/20 transition">
                            <span class="text-xl mb-1">⬆️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Withdraw</span>
                        </button>
                    </div>
                </div>
                <div class="market-terminal bg-[#0a0b0d] p-8 rounded-[2.5rem] border border-gray-800 shadow-2xl">
                    <gecko-coin-ticker-widget coin-id="solana" initial-currency="usd" locale="en" dark-mode="true" transparent-background="true"></gecko-coin-ticker-widget>
                    <div class="grid grid-cols-2 gap-3 mt-8">
                        <button onclick="openDeposit('SOL', 'SOL-WALLET-ADDR')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-green-500/20 transition">
                            <span class="text-xl mb-1">⬇️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Deposit</span>
                        </button>
                        <button onclick="alert('Withdrawal Locked')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-red-500/20 transition">
                            <span class="text-xl mb-1">⬆️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Withdraw</span>
                        </button>
                    </div>
                </div>
                <div class="market-terminal bg-[#0a0b0d] p-8 rounded-[2.5rem] border border-gray-800 shadow-2xl">
                    <gecko-coin-ticker-widget coin-id="tether-gold" initial-currency="usd" locale="en" dark-mode="true" transparent-background="true"></gecko-coin-ticker-widget>
                    <div class="grid grid-cols-2 gap-3 mt-8">
                        <button onclick="openDeposit('XAUT', 'XAUT-WALLET-ADDR')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-green-500/20 transition">
                            <span class="text-xl mb-1">⬇️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Deposit</span>
                        </button>
                        <button onclick="alert('Withdrawal Locked')" class="py-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col items-center justify-center hover:bg-red-500/20 transition">
                            <span class="text-xl mb-1">⬆️</span><span class="text-[9px] font-black uppercase text-white tracking-widest">Withdraw</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-100 flex flex-col justify-between">
                <div>
                    <h4 class="font-black text-2xl text-black uppercase">STARTER PLAN</h4>
                    <p class="text-green-600 font-bold text-sm">50% YIELD IN 7DAYS</p>
                </div>
                <button onclick="alert('Plan Selected')" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-black text-[10px] uppercase mt-6">SELECT PLAN</button>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-100 flex flex-col justify-between">
                <div>
                    <h4 class="font-black text-2xl text-black uppercase">PRO INVESTOR PLAN</h4>
                    <p class="text-green-600 font-bold text-sm">150% YIELD IN 16DAYS</p>
                </div>
                <button onclick="alert('Plan Selected')" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-black text-[10px] uppercase mt-6">SELECT PLAN</button>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-100 flex flex-col justify-between">
                <div>
                    <h4 class="font-black text-2xl text-black uppercase">TOP INVESTOR PLAN</h4>
                    <p class="text-green-600 font-bold text-sm">250% YIELD IN 30DAYS</p>
                </div>
                <button onclick="alert('Plan Selected')" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-black text-[10px] uppercase mt-6">SELECT PLAN</button>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if(sb.classList.contains('sidebar-open')) {
                sb.classList.replace('sidebar-open', 'sidebar-closed');
                overlay.style.opacity = "0"; overlay.classList.add('pointer-events-none');
            } else {
                sb.classList.replace('sidebar-closed', 'sidebar-open');
                overlay.style.opacity = "1"; overlay.classList.remove('pointer-events-none');
            }
        }
        function openDeposit(asset, addr) {
            document.getElementById('depAsset').innerText = asset;
            document.getElementById('modalAddr').innerText = addr;
            document.getElementById('depositModal').classList.add('active');
            document.getElementById('global-overlay').style.opacity = "1";
            document.getElementById('global-overlay').classList.remove('pointer-events-none');
        }
        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            document.getElementById('global-overlay').style.opacity = "0";
            document.getElementById('global-overlay').classList.add('pointer-events-none');
        }
        function completeDeposit() { alert("Deposit Initiated"); closeAllModals(); }
        function logout() { 
            if(confirm("Logout?")) window.location.href = "index.html"; //
        }
    </script>
</body>
</html>
