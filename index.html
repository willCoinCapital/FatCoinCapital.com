<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatCoin Capital</title>
    <style>
        :root {
            --pitch-black: #000000;
            --fcc-green: #C2FF77; /* Correct green from inspiration image_7.png */
            --glow-green: rgba(194, 255, 119, 0.4);
            --fcc-text: #E5E7EB;
            --muted-gray: rgba(255, 255, 255, 0.5);
            --card-bg: #111827; /* Dark navy card background */
            --button-blue: #3e60ed;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--fcc-text);
        }

        /* 1. Standard Mobile Container (App View) */
        .container {
            width: 100%;
            max-width: 375px;
            height: 100%;
            max-height: 812px;
            background-color: var(--pitch-black);
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 30px; /* Space for the bottom buttons */
        }

        .content {
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        h1 {
            color: #FFFFFF;
            font-size: 36px;
            font-weight: 800;
            margin: 40px 0 30px 0;
            letter-spacing: -0.5px;
        }

        /* 2. Main Comparison Area (The Core Request) */
        .comparison-layout {
            display: flex;
            gap: 15px; /* Minimal space between features and yield columns */
        }

        /* --- THE FEATURE COLUMN (Left) --- */
        .feature-column {
            flex: 1.6; /* Left side is wider to hold text */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-card {
            background-color: rgba(255,255,255, 0.03);
            border: 1px solid rgba(255,255,255, 0.05);
            border-radius: 18px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .fcc-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--pitch-black); /* Text inside green icon */
            background-color: var(--fcc-green);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--glow-green);
        }

        .fcc-icon-alt {
            font-size: 24px;
        }

        .fcc-icon-large {
            width: 50px;
            height: 50px;
        }

        .fcc-icon:not(.fcc-icon-large) svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .feature-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .feature-value {
            color: var(--fcc-green);
            font-weight: 800;
            text-shadow: 0 0 10px var(--glow-green);
        }

        /* --- THE YIELD COLUMN (Right) --- */
        .yield-column {
            flex: 1; /* Yield side is narrower */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .yield-header-card {
            padding: 15px 20px;
            font-size: 14px;
            line-height: 1.4;
            font-weight: 500;
            color: #C2FF77;
            text-shadow: 0 0 8px var(--glow-green);
        }

        .yield-value-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255, 0.1);
            border-radius: 18px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 70px; /* Fixed height for symmetry with left cards */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .yield-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--fcc-green);
            text-shadow: 0 0 10px var(--glow-green);
            margin-bottom: 3px;
        }

        .yield-projected {
            font-size: 11px;
            color: var(--muted-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .yield-muted {
            font-size: 18px;
            font-weight: 700;
            color: var(--muted-gray);
        }

        .yield-description-card {
            padding: 20px 20px;
            color: var(--fcc-green);
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }

        /* 3. Bottom Action Buttons */
        .footer-actions {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .signin-btn {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
        }

        .signup-btn {
            background-color: var(--button-blue);
            color: #FFFFFF;
            padding: 18px 40px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 6px 15px rgba(62, 96, 237, 0.2);
        }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="content">
            <h1>Welcome Back!</h1>
            
            <div class="comparison-layout">
                
                <div class="feature-column">
                    <div class="feature-card">
                        <div class="fcc-icon">$</div>
                        <div class="feature-text">Earn <span class="feature-value">$0.50</span> Daily Interest</div>
                    </div>
                    
                    <div class="feature-card">
                        <div class="fcc-icon fcc-icon-alt fcc-icon-large">🏆</div>
                        <div class="feature-text">Instant <span class="feature-value">$200</span> Signup Bonus</div>
                    </div>
                    
                    <div class="feature-card">
                        <div class="fcc-icon fcc-icon-alt">₿</div>
                        <div class="feature-text">Deposit with Bitcoin</div>
                    </div>
                    
                    <div class="feature-card">
                        <div class="fcc-icon fcc-icon-alt">⌚</div>
                        <div class="feature-text">7-Day Investment Cycle</div>
                    </div>
                </div>
                
                <div class="yield-column">
                    <div class="yield-header-card">50% Investment Yields in 7 Days</div>
                    
                    <div class="yield-value-card">
                        <div class="yield-value">$3.50</div>
                        <div class="yield-projected">Gain</div>
                    </div>
                    
                    <div class="yield-value-card">
                        <div class="yield-value">$100*</div>
                        <div class="yield-projected">Bonus Gain</div>
                    </div>
                    
                    <div class="yield-value-card">
                        <div class="yield-muted">N/A</div>
                    </div>
                    
                    <div class="yield-description-card">50% of invested amount</div>
                </div>
                
            </div>
        </div>

        <div class="footer-actions">
            <a href="#" class="signin-btn">Sign in</a>
            <a href="#" class="signup-btn">Sign up</a>
        </div>
        
    </div>

</body>
</html>
