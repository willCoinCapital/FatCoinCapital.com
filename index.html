<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fatCoinCapital | Live Market Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #sidebar.open { transform: translateX(0); }
        #overlay { transition: opacity 0.3s ease; pointer-events: none; opacity: 0; }
        #overlay.open { pointer-events: auto; opacity: 1; }
        .modal { transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; opacity: 0; transform: scale(0.95); }
        .modal.open { pointer-events: auto; opacity: 1; transform: scale(1); }
        
        /* Professional Card Styling */
        .market-card { border-radius: 2.5rem; background: #0a0b0d; border: 1px solid #1f2937; overflow: hidden; transition: all 0.3s ease; }
        .market-card:hover { border-color: #2b59ff; transform: translateY(-2px); }
        
        .ticker-container { display: flex; overflow: hidden; background: black; padding: 1rem 0; border-y: 1px solid #1f2937; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .ticker-content { display: inline-block; white-space: nowrap; animation: ticker 35s linear infinite; }
    </style>
</head>
<body class="bg-white text-gray-900 overflow-x-hidden">

    <script src="https://widgets.coingecko.com/gecko-coin-ticker-widget.js"></script>

            </button>
            <h2 class="text-3xl font-black uppercase mb-2">Create Account</h2>

    </div>

    <header class="sticky top-0 bg-white/95 backdrop-blur-md z-50 px-4 py-4 border-b border-gray-100">

            <div class="flex items-center gap-3">
                <button onclick="openModal('signup')" class="bg-[#2b59ff] text-white px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider shadow-lg hover:bg-blue-700 transition">Sign Up</button>
                <button onclick="toggleMenu()" class="p-2.5 text-gray-800 bg-gray-50 rounded-xl border border-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>

                </div>
                </div>
        </div>

        </main>

    <script>
        // NAVIGATION & MODAL LOGIC (Preserved exactly from your original)
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }
        function openModal(type) {
            closeAll();
            document.getElementById(type + 'Modal').classList.add('open');
            document.getElementById('overlay').classList.add('open');
        }
        function closeAll() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
        document.getElementById('registrationForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            if(name.trim() !== "") {
                localStorage.setItem('fatCoinUser', name);
                window.location.href = 'dashboard.html';
            }
        };
    </script>
