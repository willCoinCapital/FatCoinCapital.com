<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back | FatCoin Capital</title>
    <style>
        /* CSS resets for a clean canvas */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Keep the screen clean */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f5f9; /* The soft background color of the canvas */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. Main Container (The Phone View) */
        .container {
            width: 100%;
            max-width: 375px; /* Matches modern mobile width */
            height: 100%;
            max-height: 812px; /* Matches modern mobile height */
            background-color: white;
            border-radius: 40px; /* Rounded screen corners from the image */
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); /* Subtle shadow for depth */
            overflow: hidden; /* Keeps the background image contained */
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 2. Background Image Layer (Asset needed from Step 1) */
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Important: Links to the file in your GitHub repo */
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            z-index: 1; /* Sets the base layer */
        }

        /* 3. Content Layer (Text and buttons) */
        .content {
            position: relative;
            z-index: 2; /* Lifts content above background image */
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 0 40px; /* Generous side padding */
        }

        h1 {
            color: white;
            font-size: 32px; /* Large header text from image */
            font-weight: 700;
            margin: 0 0 10px 0; /* Tight spacing to subheader */
            text-align: left;
        }

        p {
            color: rgba(255, 255, 255, 0.85); /* Slightly transparent white */
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            text-align: left;
            max-width: 260px; /* Controls text wrap like the design */
        }

        /* 4. Action Area (Fixed Bottom Buttons) */
        .action-area {
            position: absolute;
            bottom: 30px; /* Fixed distance from screen bottom */
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: flex-end; /* Aligns primary button right */
        }

        .signin-link {
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 15px 20px;
            position: absolute;
            left: 0; /* Fixed text on the left */
            bottom: 0;
        }

        /* "Sign up" button styling inside the white box */
        .signup-btn {
            background-color: white;
            color: #3f5fed; /* Primary Blue from design */
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            padding: 18px 45px;
            border-radius: 12px; /* Very soft corners */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="background-image"></div>
        
        <div class="content">
            <h1>Welcome Back!</h1>
            <p>Enter personal details to access your FatCoinCapital dashboard.</p>
        </div>
        
        <div class="action-area">
            <a href="#" class="signin-link">Sign in</a>
            <a href="#" class="signup-btn">Sign up</a>
        </div>
        
    </div>

</body>
</html>
