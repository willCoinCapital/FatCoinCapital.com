<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatCoin Capital</title>
    <style>
        /* Base page setup */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f0f2f5; /* Light gray outer background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Phone Container */
        .container {
            width: 100%;
            max-width: 375px;
            height: 100%;
            max-height: 812px;
            background-color: #000000; /* PITCH BLACK */
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Content Layer */
        .content {
            padding: 80px 40px; /* Space from top and sides */
            margin-top: auto;
            margin-bottom: auto;
        }

        h1 {
            color: #ffffff;
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 15px 0;
            letter-spacing: -0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.7); /* Muted white text */
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            max-width: 260px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 40px; /* Distance from bottom of screen */
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between; /* Pushes Sign In left, Sign Up right */
            align-items: center;
        }

        .signin-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 10px;
        }

        /* The signature white button */
        .signup-btn {
            background-color: #ffffff;
            color: #000000; /* Black text on white button */
            padding: 18px 40px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            transition: transform 0.2s ease;
        }

        .signup-btn:active {
            transform: scale(0.95); /* Adds a little "click" feel */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="content">
            <h1>Welcome Back!</h1>
            <p>Enter personal details to access your FatCoin Capital portfolio.</p>
        </div>
        
        <div class="bottom-nav">
            <a href="#" class="signin-link">Sign in</a>
            <a href="#" class="signup-btn">Sign up</a>
        </div>
        
    </div>

</body>
</html>
