<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatCoin Capital</title>
    <style>
        :root {
            --pitch-black: #000000;
            --text-white: #FFFFFF;
            --muted-gray: rgba(255, 255, 255, 0.6);
            --accent-cyan: #3FE1F5;
            --card-bg: #111111;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 375px;
            height: 100%;
            max-height: 812px;
            background-color: var(--pitch-black);
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content {
            padding: 60px 30px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        h1 {
            color: var(--text-white);
            font-size: 38px;
            font-weight: 800;
            margin: 60px 0 40px 0; /* Increased bottom margin since subtext is gone */
        }

        /* The Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #222;
        }

        .card-label {
            font-size: 10px;
            color: var(--muted-gray);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-white);
        }

        .highlight {
            border: 1px solid var(--accent-cyan);
        }
        .highlight .card-label { color: var(--accent-cyan); }

        .full-width-card {
            grid-column: span 2;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: var(--accent-cyan);
            background: rgba(63, 225, 245, 0.05);
            border: 1px solid rgba(63, 225, 245, 0.2);
            border-radius: 12px;
        }

        /* Bottom Navigation */
        .footer {
            position: absolute;
            bottom: 40px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-signin {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
        }

        .btn-signup {
            background: white;
            color: black;
            padding: 18px 45px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">
            <h1>Welcome Back!</h1>

            <div class="grid">
                <div class="card">
                    <div class="card-label">Daily Balance</div>
                    <div class="card-value">$0.50</div>
                </div>
                <div class="card">
                    <div class="card-label">Investment Cycle</div>
                    <div class="card-value">7 Days</div>
                </div>
                <div class="card highlight">
                    <div class="card-label">Rate of Yield</div>
                    <div class="card-value">50%</div>
                </div>
                <div class="card">
                    <div class="card-label">Projected Gain*</div>
                    <div class="card-value">$100</div>
                </div>
                <div class="card full-width-card">
                    Deposits via: [ BITCOIN ]
                </div>
            </div>
        </div>

        <div class="footer">
            <a href="#" class="btn-signin">Sign in</a>
            <a href="#" class="btn-signup">Sign up</a>
        </div>
    </div>

</body>
</html>
