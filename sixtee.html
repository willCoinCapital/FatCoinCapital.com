<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCC COMMAND CENTER | sixtee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        .admin-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; padding: 1.5rem; transition: all 0.3s ease; }
        .admin-card:hover { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); }
        .input-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; margin-bottom: 0.5rem; letter-spacing: 0.1em; }
        input, select { width: 100%; background: #020617; border: 1px solid #334155; padding: 0.75rem; border-radius: 0.75rem; color: white; font-weight: 600; outline: none; }
        input:focus { border-color: #3b82f6; ring: 2px ring-blue-500/20; }
        .btn-primary { background: #2563eb; color: white; width: 100%; padding: 1rem; border-radius: 1rem; font-weight: 900; text-transform: uppercase; font-size: 12px; letter-spacing: 0.1em; }
        .btn-panic { background: #e11d48; color: white; width: 100%; padding: 1rem; border-radius: 1rem; font-weight: 900; text-transform: uppercase; font-size: 12px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-6 pb-24">

    <header class="max-w-5xl mx-auto flex justify-between items-center mb-10 border-b border-slate-800 pb-6">
        <div>
            <h1 class="text-3xl font-900 uppercase tracking-tighter italic">FATCOIN <span class="text-blue-500">SIXTEE</span></h1>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Authorized Personnel Only | System v4.0</p>
        </div>
        <div id="syncStatus" class="px-4 py-2 bg-green-500/10 text-green-400 rounded-full text-[10px] font-black uppercase border border-green-500/20">
            Node Online
        </div>
    </header>

    <main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <section class="admin-card md:col-span-1">
            <h2 class="text-xs font-900 uppercase text-blue-400 mb-6">User Simulation</h2>
            <div class="input-group">
                <label>Daily Growth Rate (%)</label>
                <input type="number" step="0.01" id="profitRate" placeholder="e.g. 2.45">
            </div>
            <div class="input-group">
                <label>Override Portfolio ($)</label>
                <input type="number" id="overrideBalance" placeholder="50000.00">
            </div>
            <div class="input-group">
                <label>Account Tier</label>
                <select id="userTier">
                    <option value="STANDARD">Standard ($200 Bonus)</option>
                    <option value="VIP">Institutional VIP</option>
                    <option value="WHALE">Whale Tier</option>
                </select>
            </div>
            <button onclick="saveSimulation()" class="btn-primary">Update Simulation</button>
        </section>

        <section class="admin-card md:col-span-1">
            <h2 class="text-xs font-900 uppercase text-blue-400 mb-6">Global Wallet Logic</h2>
            <div class="input-group">
                <label>BTC Address</label>
                <input type="text" id="masterBTC">
            </div>
            <div class="input-group">
                <label>ETH Address</label>
                <input type="text" id="masterETH">
            </div>
            <div class="input-group">
                <label>SOL Address</label>
                <input type="text" id="masterSOL">
            </div>
            <button onclick="saveWallets()" class="btn-primary">Push To All Buttons</button>
        </section>

        <section class="admin-card md:col-span-1 border-red-900/30">
            <h2 class="text-xs font-900 uppercase text-red-500 mb-6">Security & Panic</h2>
            <div class="input-group">
                <label>Maintenance Mode</label>
                <select id="maintMode" onchange="togglePanicUI()">
                    <option value="OFF">Site: Online</option>
                    <option value="ON">Site: Maintenance Lock</option>
                </select>
            </div>
            <div id="panicBtnContainer" class="mt-4">
                <button onclick="triggerPanic()" class="btn-panic">Execute Site Lockdown</button>
            </div>
            <p class="text-[9px] text-slate-500 mt-4 uppercase text-center font-bold">Lockdown hides all market data and login forms.</p>
        </section>

        <section class="admin-card md:col-span-2">
            <h2 class="text-xs font-900 uppercase text-blue-400 mb-6">Institutional Reserves</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>Company Liquidity ($)</label>
                    <input type="text" id="totalLiquidity" placeholder="e.g. $50,000,000">
                </div>
                <div class="input-group">
                    <label>Active Investors Count</label>
                    <input type="number" id="investorCount" placeholder="10250">
                </div>
            </div>
            <button onclick="saveReserves()" class="btn-primary">Update Public Metrics</button>
        </section>

        <section class="admin-card md:col-span-1">
            <h2 class="text-xs font-900 uppercase text-blue-400 mb-6">Global Ticker</h2>
            <div class="input-group">
                <label>Custom Message</label>
                <input type="text" id="tickerMsg" maxlength="100">
            </div>
            <button onclick="saveTicker()" class="btn-primary">Broadcast Live</button>
        </section>

    </main>

    <script>
        window.onload = function() {
            // Fill current values from LocalStorage
            document.getElementById('profitRate').value = localStorage.getItem('fcc_profit_rate') || '0.07';
            document.getElementById('overrideBalance').value = localStorage.getItem('fcc_bal_override') || '200.14';
            document.getElementById('masterBTC').value = localStorage.getItem('fcc_btc_addr') || '';
            document.getElementById('masterETH').value = localStorage.getItem('fcc_eth_addr') || '';
            document.getElementById('masterSOL').value = localStorage.getItem('fcc_sol_addr') || '';
            document.getElementById('maintMode').value = localStorage.getItem('fcc_maint_mode') || 'OFF';
            document.getElementById('tickerMsg').value = localStorage.getItem('fcc_ticker_msg') || 'CLAIM $200 BONUS ON SIGN-UP';
            document.getElementById('totalLiquidity').value = localStorage.getItem('fcc_reserves') || '$5,000,000';
            document.getElementById('investorCount').value = localStorage.getItem('fcc_user_count') || '10000';
        };

        function saveSimulation() {
            localStorage.setItem('fcc_profit_rate', document.getElementById('profitRate').value);
            localStorage.setItem('fcc_bal_override', document.getElementById('overrideBalance').value);
            localStorage.setItem('fcc_tier', document.getElementById('userTier').value);
            flash();
        }

        function saveWallets() {
            localStorage.setItem('fcc_btc_addr', document.getElementById('masterBTC').value);
            localStorage.setItem('fcc_eth_addr', document.getElementById('masterETH').value);
            localStorage.setItem('fcc_sol_addr', document.getElementById('masterSOL').value);
            flash();
        }

        function triggerPanic() {
            localStorage.setItem('fcc_maint_mode', 'ON');
            document.getElementById('maintMode').value = 'ON';
            alert('CRITICAL: Site has been locked. Only visitors with Admin cookies can view content.');
            flash();
        }

        function saveReserves() {
            localStorage.setItem('fcc_reserves', document.getElementById('totalLiquidity').value);
            localStorage.setItem('fcc_user_count', document.getElementById('investorCount').value);
            flash();
        }

        function saveTicker() {
            localStorage.setItem('fcc_ticker_msg', document.getElementById('tickerMsg').value);
            flash();
        }

        function flash() {
            const s = document.getElementById('syncStatus');
            s.innerText = "COMMAND EXECUTED";
            s.style.background = "#2563eb";
            setTimeout(() => { s.innerText = "Node Online"; s.style.background = "rgba(34, 197, 94, 0.1)"; }, 1500);
        }
    </script>
</body>
</html>
